<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon carnet de météos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8f7f4;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .carnet {
      max-width: 680px;
      margin: 0 auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.07);
      padding: 2rem 1.5rem;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #2c2c2a;
      margin-bottom: 0.2rem;
    }
    .subtitle {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 1.5rem;
    }
    .week-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }
    .week-label {
      font-size: 14px;
      font-weight: 500;
      color: #2c2c2a;
    }
    .nav-btn {
      background: none;
      border: 1px solid #d3d1c7;
      border-radius: 8px;
      padding: 5px 12px;
      font-size: 13px;
      color: #666;
      cursor: pointer;
    }
    .nav-btn:hover { background: #f1efe8; }
    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 1.5rem;
    }
    .day-col { display: flex; flex-direction: column; gap: 5px; }
    .day-header {
      font-size: 10px;
      font-weight: 600;
      color: #aaa;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding-bottom: 3px;
    }
    .day-header.today { color: #1D9E75; }
    .section-card {
      border-radius: 8px;
      border: 1px solid #e8e6e0;
      background: #fff;
      padding: 5px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.15s;
      min-height: 52px;
      gap: 3px;
    }
    .section-card:hover { border-color: #b4b2a9; }
    .section-label {
      font-size: 8px;
      color: #bbb;
      text-align: center;
      line-height: 1.3;
    }
    .meteo-icon { font-size: 18px; line-height: 1; }
    .mot-text {
      font-size: 8px;
      color: #534AB7;
      text-align: center;
      line-height: 1.3;
      font-weight: 500;
      word-break: break-word;
    }
    .victoire-text {
      font-size: 8px;
      color: #0F6E56;
      text-align: center;
      line-height: 1.3;
      font-weight: 500;
      word-break: break-word;
    }
    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 0.25rem;
      margin-bottom: 1.5rem;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: #888;
    }
    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 16px;
      padding: 1.5rem;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.15);
    }
    .modal-title {
      font-size: 16px;
      font-weight: 600;
      color: #2c2c2a;
      margin-bottom: 1.25rem;
    }
    .modal-section { margin-bottom: 1rem; }
    .modal-section label {
      font-size: 12px;
      color: #666;
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .meteo-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .meteo-opt {
      font-size: 24px;
      cursor: pointer;
      padding: 5px;
      border-radius: 8px;
      border: 2px solid transparent;
      transition: border-color 0.1s, background 0.1s;
      line-height: 1;
    }
    .meteo-opt:hover { border-color: #d3d1c7; }
    .meteo-opt.selected { border-color: #1D9E75; background: #E1F5EE; }
    .modal input[type=text] {
      width: 100%;
      font-size: 14px;
      border: 1px solid #d3d1c7;
      border-radius: 8px;
      padding: 8px 10px;
      background: #fff;
      color: #2c2c2a;
      font-family: inherit;
    }
    .modal input[type=text]:focus {
      outline: none;
      border-color: #1D9E75;
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 1.25rem;
    }
    .btn-save {
      flex: 1;
      background: #1D9E75;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-save:hover { background: #0F6E56; }
    .btn-cancel {
      background: none;
      border: 1px solid #d3d1c7;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      color: #666;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-cancel:hover { background: #f1efe8; }
    .btn-delete {
      background: none;
      border: 1px solid #F09595;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #A32D2D;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-delete:hover { background: #FCEBEB; }
    .footer {
      text-align: center;
      font-size: 11px;
      color: #ccc;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
<div class="carnet">
  <h1>Mon carnet de météos</h1>
  <p class="subtitle">Ma météo, mon mot du jour, ma petite victoire</p>

  <div class="week-nav">
    <button class="nav-btn" onclick="changeWeek(-1)">← avant</button>
    <span class="week-label" id="weekLabel"></span>
    <button class="nav-btn" onclick="changeWeek(1)">après →</button>
  </div>

  <div class="days-grid" id="daysGrid"></div>

  <div class="legend">
    <div class="legend-item">
      <div class="legend-dot" style="background:#FAC775"></div>
      Météo matin
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#AFA9EC"></div>
      Mot du jour
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#9FE1CB"></div>
      Petite victoire
    </div>
  </div>

  <p class="footer">patriciapsy.fr</p>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <p class="modal-title" id="modalTitle">Lundi</p>
    <div class="modal-section">
      <label>Ma météo du matin</label>
      <div class="meteo-row" id="meteoRow">
        <span class="meteo-opt" data-val="☀️" onclick="selectMeteo(this)">☀️</span>
        <span class="meteo-opt" data-val="⛅" onclick="selectMeteo(this)">⛅</span>
        <span class="meteo-opt" data-val="☁️" onclick="selectMeteo(this)">☁️</span>
        <span class="meteo-opt" data-val="🌧️" onclick="selectMeteo(this)">🌧️</span>
        <span class="meteo-opt" data-val="⛈️" onclick="selectMeteo(this)">⛈️</span>
        <span class="meteo-opt" data-val="🌈" onclick="selectMeteo(this)">🌈</span>
      </div>
    </div>
    <div class="modal-section">
      <label>Un mot de ma journée</label>
      <input type="text" id="motInput" placeholder="ex : fatiguée, soulagée, contente..." maxlength="40">
    </div>
    <div class="modal-section">
      <label>Ma petite victoire du jour</label>
      <input type="text" id="victoireInput" placeholder="même toute petite..." maxlength="50">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn-delete" onclick="deleteEntry()">Effacer</button>
      <button class="btn-save" onclick="saveEntry()">Enregistrer</button>
    </div>
  </div>
</div>

<script>
const DAYS = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const FULL = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const MONTHS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

let data = JSON.parse(localStorage.getItem('carnet-meteos') || '{}');
let weekOffset = 0;
let editingKey = null;
let selectedMeteo = '';

function save() {
  localStorage.setItem('carnet-meteos', JSON.stringify(data));
}

function getMonday(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = date.getDate() - day + (day === 0 ? -6 : 1);
  date.setDate(diff);
  date.setHours(0,0,0,0);
  return date;
}

function dateKey(d) { return d.toISOString().slice(0,10); }

function isToday(d) {
  const t = new Date();
  return d.getDate()===t.getDate() && d.getMonth()===t.getMonth() && d.getFullYear()===t.getFullYear();
}

function getWeekDays() {
  const monday = getMonday(new Date());
  monday.setDate(monday.getDate() + weekOffset * 7);
  return Array.from({length:7}, (_,i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    return d;
  });
}

function render() {
  const days = getWeekDays();
  const m = days[0], s = days[6];
  document.getElementById('weekLabel').textContent =
    m.getDate()+' '+MONTHS[m.getMonth()]+' – '+s.getDate()+' '+MONTHS[s.getMonth()]+' '+s.getFullYear();

  const grid = document.getElementById('daysGrid');
  grid.innerHTML = '';

  days.forEach((d, i) => {
    const key = dateKey(d);
    const e = data[key] || {};
    const col = document.createElement('div');
    col.className = 'day-col';

    const hdr = document.createElement('div');
    hdr.className = 'day-header' + (isToday(d) ? ' today' : '');
    hdr.textContent = DAYS[i];
    col.appendChild(hdr);

    const cards = [
      { bg: e.meteo ? '#FFF3DC' : '', content: e.meteo
          ? `<span class="meteo-icon">${e.meteo}</span>`
          : `<span class="section-label">météo<br>matin</span>` },
      { bg: e.mot ? '#F0EFFE' : '', content: e.mot
          ? `<span class="mot-text">${e.mot}</span>`
          : `<span class="section-label">mot du<br>jour</span>` },
      { bg: e.victoire ? '#E4F8F0' : '', content: e.victoire
          ? `<span class="victoire-text">${e.victoire}</span>`
          : `<span class="section-label">petite<br>victoire</span>` }
    ];

    cards.forEach(c => {
      const card = document.createElement('div');
      card.className = 'section-card';
      card.style.background = c.bg;
      card.innerHTML = c.content;
      card.onclick = () => openModal(key, d, i);
      col.appendChild(card);
    });

    grid.appendChild(col);
  });
}

function openModal(key, d, dayIdx) {
  editingKey = key;
  selectedMeteo = (data[key]||{}).meteo || '';
  document.getElementById('modalTitle').textContent = FULL[dayIdx]+' '+d.getDate()+' '+MONTHS[d.getMonth()];
  document.getElementById('motInput').value = (data[key]||{}).mot || '';
  document.getElementById('victoireInput').value = (data[key]||{}).victoire || '';
  document.querySelectorAll('.meteo-opt').forEach(el => {
    el.classList.toggle('selected', el.dataset.val === selectedMeteo);
  });
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  editingKey = null;
}

function selectMeteo(el) {
  selectedMeteo = el.dataset.val;
  document.querySelectorAll('.meteo-opt').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
}

function saveEntry() {
  if (!editingKey) return;
  data[editingKey] = {
    meteo: selectedMeteo,
    mot: document.getElementById('motInput').value.trim(),
    victoire: document.getElementById('victoireInput').value.trim()
  };
  save();
  closeModal();
  render();
}

function deleteEntry() {
  if (!editingKey) return;
  delete data[editingKey];
  save();
  closeModal();
  render();
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

function changeWeek(dir) {
  weekOffset += dir;
  render();
}

render();
</script>
</body>
</html>
