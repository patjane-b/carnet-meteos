<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Mon carnet de météos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8f7f4;
      min-height: 100vh;
      padding: 12px;
    }
    .carnet {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07);
      padding: 1.5rem 1.25rem;
    }
    h1 { font-size: 22px; font-weight: 700; color: #2c2c2a; margin-bottom: 0.2rem; }
    .subtitle { font-size: 14px; color: #999; margin-bottom: 1.5rem; }
    .week-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      gap: 8px;
    }
    .week-label { font-size: 15px; font-weight: 600; color: #2c2c2a; text-align: center; flex: 1; }
    .nav-btn {
      background: none;
      border: 1.5px solid #d3d1c7;
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      color: #555;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .nav-btn:hover { background: #f1efe8; }
    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 1.5rem;
    }
    .day-col { display: flex; flex-direction: column; gap: 6px; }
    .day-header {
      font-size: 13px;
      font-weight: 700;
      color: #888;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding-bottom: 4px;
    }
    .day-header.today { color: #1D9E75; }
    .section-card {
      border-radius: 10px;
      border: 1.5px solid #e8e6e0;
      background: #fff;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s;
      min-height: 70px;
      gap: 4px;
    }
    .section-card:hover { border-color: #999; transform: scale(1.02); }
    .section-label {
      font-size: 11px;
      color: #bbb;
      text-align: center;
      line-height: 1.4;
      font-weight: 500;
    }
    .meteo-icon { font-size: 26px; line-height: 1; }
    .mot-text {
      font-size: 11px;
      color: #3C3489;
      text-align: center;
      line-height: 1.4;
      font-weight: 600;
      word-break: break-word;
      padding: 0 4px;
    }
    .victoire-text {
      font-size: 11px;
      color: #085041;
      text-align: center;
      line-height: 1.4;
      font-weight: 600;
      word-break: break-word;
      padding: 0 4px;
    }
    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #666; font-weight: 500; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }
    @media (min-width: 500px) { .modal-overlay { align-items: center; padding: 1rem; } }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 20px 20px 0 0;
      padding: 1.25rem 1.5rem 2.5rem;
      width: 100%;
      max-width: 460px;
    }
    @media (min-width: 500px) { .modal { border-radius: 16px; padding: 1.75rem; } }
    .modal-handle { width: 44px; height: 5px; background: #e0ddd6; border-radius: 3px; margin: 0 auto 1.25rem; }
    @media (min-width: 500px) { .modal-handle { display: none; } }
    .modal-title { font-size: 18px; font-weight: 700; color: #2c2c2a; margin-bottom: 1.25rem; }
    .modal-section { margin-bottom: 1.1rem; }
    .modal-section label { font-size: 13px; color: #555; display: block; margin-bottom: 8px; font-weight: 600; }
    .meteo-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .meteo-opt {
      font-size: 32px;
      cursor: pointer;
      padding: 6px;
      border-radius: 12px;
      border: 2.5px solid transparent;
      transition: border-color 0.1s, background 0.1s;
      line-height: 1;
    }
    .meteo-opt:hover { border-color: #d3d1c7; }
    .meteo-opt.selected { border-color: #1D9E75; background: #E1F5EE; }
    .modal input[type=text] {
      width: 100%;
      font-size: 16px;
      border: 1.5px solid #d3d1c7;
      border-radius: 10px;
      padding: 12px 14px;
      background: #fff;
      color: #2c2c2a;
      font-family: inherit;
      -webkit-appearance: none;
    }
    .modal input[type=text]:focus { outline: none; border-color: #1D9E75; }
    .modal-actions { display: flex; gap: 8px; margin-top: 1.5rem; }
    .btn-save {
      flex: 1;
      background: #1D9E75;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-save:hover { background: #0F6E56; }
    .btn-cancel {
      background: none;
      border: 1.5px solid #d3d1c7;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 15px;
      color: #666;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-cancel:hover { background: #f1efe8; }
    .btn-delete {
      background: none;
      border: 1.5px solid #F09595;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 14px;
      color: #A32D2D;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-delete:hover { background: #FCEBEB; }
    .footer { text-align: center; font-size: 12px; color: #ccc; margin-top: 1rem; }
  </style>
</head>
<body>
<div class="carnet">
  <h1>Mon carnet de météos</h1>
  <p class="subtitle">Ma météo · mon mot du jour · ma petite victoire</p>
  <div class="week-nav">
    <button class="nav-btn" onclick="changeWeek(-1)">← avant</button>
    <span class="week-label" id="weekLabel"></span>
    <button class="nav-btn" onclick="changeWeek(1)">après →</button>
  </div>
  <div class="days-grid" id="daysGrid"></div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#FAC775"></div>Météo du matin</div>
    <div class="legend-item"><div class="legend-dot" style="background:#7F77DD"></div>Mot du jour</div>
    <div class="legend-item"><div class="legend-dot" style="background:#5DCAA5"></div>Petite victoire</div>
  </div>
  <p class="footer">patriciapsy.fr</p>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <p class="modal-title" id="modalTitle">Lundi</p>
    <div class="modal-section">
      <label>Ma météo du matin</label>
      <div class="meteo-row">
        <span class="meteo-opt" data-val="☀️" onclick="selectMeteo(this)">☀️</span>
        <span class="meteo-opt" data-val="⛅" onclick="selectMeteo(this)">⛅</span>
        <span class="meteo-opt" data-val="☁️" onclick="selectMeteo(this)">☁️</span>
        <span class="meteo-opt" data-val="🌧️" onclick="selectMeteo(this)">🌧️</span>
        <span class="meteo-opt" data-val="⛈️" onclick="selectMeteo(this)">⛈️</span>
        <span class="meteo-opt" data-val="🌈" onclick="selectMeteo(this)">🌈</span>
      </div>
    </div>
    <div class="modal-section">
      <label>Un mot de ma journée</label>
      <input type="text" id="motInput" placeholder="ex : fatiguée, soulagée, contente..." maxlength="40">
    </div>
    <div class="modal-section">
      <label>Ma petite victoire du jour</label>
      <input type="text" id="victoireInput" placeholder="même toute petite..." maxlength="50">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn-delete" onclick="deleteEntry()">Effacer</button>
      <button class="btn-save" onclick="saveEntry()">Enregistrer</button>
    </div>
  </div>
</div>

<script>
const DAYS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const FULL=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const MONTHS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
let data={};
try{data=JSON.parse(localStorage.getItem('carnet-meteos')||'{}');}catch(e){}
let weekOffset=0,editingKey=null,selectedMeteo='';
function save(){try{localStorage.setItem('carnet-meteos',JSON.stringify(data));}catch(e){}}
function getMonday(d){const date=new Date(d);const day=date.getDay();const diff=date.getDate()-day+(day===0?-6:1);date.setDate(diff);date.setHours(0,0,0,0);return date;}
function dateKey(d){return d.toISOString().slice(0,10);}
function isToday(d){const t=new Date();return d.getDate()===t.getDate()&&d.getMonth()===t.getMonth()&&d.getFullYear()===t.getFullYear();}
function getWeekDays(){const monday=getMonday(new Date());monday.setDate(monday.getDate()+weekOffset*7);return Array.from({length:7},(_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return d;});}
function render(){
  const days=getWeekDays();
  const m=days[0],s=days[6];
  document.getElementById('weekLabel').textContent=m.getDate()+' '+MONTHS[m.getMonth()]+' – '+s.getDate()+' '+MONTHS[s.getMonth()]+' '+s.getFullYear();
  const grid=document.getElementById('daysGrid');
  grid.innerHTML='';
  days.forEach((d,i)=>{
    const key=dateKey(d);const e=data[key]||{};
    const col=document.createElement('div');col.className='day-col';
    const hdr=document.createElement('div');hdr.className='day-header'+(isToday(d)?' today':'');hdr.textContent=DAYS[i];col.appendChild(hdr);
    [{bg:e.meteo?'#FFF0C8':'',border:e.meteo?'#FAC775':'',content:e.meteo?`<span class="meteo-icon">${e.meteo}</span>`:`<span class="section-label">météo</span>`},
     {bg:e.mot?'#EEEDFE':'',border:e.mot?'#AFA9EC':'',content:e.mot?`<span class="mot-text">${e.mot}</span>`:`<span class="section-label">mot du jour</span>`},
     {bg:e.victoire?'#D8F5EC':'',border:e.victoire?'#5DCAA5':'',content:e.victoire?`<span class="victoire-text">${e.victoire}</span>`:`<span class="section-label">victoire</span>`}
    ].forEach(c=>{
      const card=document.createElement('div');
      card.className='section-card';
      card.style.background=c.bg;
      if(c.border) card.style.borderColor=c.border;
      card.innerHTML=c.content;
      card.onclick=()=>openModal(key,d,i);
      col.appendChild(card);
    });
    grid.appendChild(col);
  });
}
function openModal(key,d,dayIdx){
  editingKey=key;selectedMeteo=(data[key]||{}).meteo||'';
  document.getElementById('modalTitle').textContent=FULL[dayIdx]+' '+d.getDate()+' '+MONTHS[d.getMonth()];
  document.getElementById('motInput').value=(data[key]||{}).mot||'';
  document.getElementById('victoireInput').value=(data[key]||{}).victoire||'';
  document.querySelectorAll('.meteo-opt').forEach(el=>el.classList.toggle('selected',el.dataset.val===selectedMeteo));
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open');editingKey=null;}
function selectMeteo(el){selectedMeteo=el.dataset.val;document.querySelectorAll('.meteo-opt').forEach(e=>e.classList.remove('selected'));el.classList.add('selected');}
function saveEntry(){if(!editingKey)return;data[editingKey]={meteo:selectedMeteo,mot:document.getElementById('motInput').value.trim(),victoire:document.getElementById('victoireInput').value.trim()};save();closeModal();render();}
function deleteEntry(){if(!editingKey)return;delete data[editingKey];save();closeModal();render();}
document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
function changeWeek(dir){weekOffset+=dir;render();}
render();
</script>
</body>
</html>
